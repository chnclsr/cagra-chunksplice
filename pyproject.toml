[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cagra-chunksplice"
version = "0.1.0"
description = "Controlled PyTorch experiments on intra-chunk connectivity in incremental proximity graphs"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cagra-chunksplice = "cagra_chunksplice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cagra_chunksplice*"]
