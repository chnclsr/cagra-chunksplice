<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1330" viewBox="0 0 1600 1330" role="img" aria-labelledby="title description">
  <title id="title">cagra-chunksplice: system architecture and experimental workflow</title>
  <desc id="description">A single Python process generates seeded synthetic data on the CPU and transfers tensors to PyTorch on the selected device. A shared exact base graph feeds independent Rebuild, Naive, ChunkSplice, and optional LocalRNG update trajectories. Each evaluated graph uses common queries and search entries. Candidate-based beam traversal is compared with exact ground truth, while separate untimed diagnostics validate structure and stream reachability. Measurements and source provenance are saved as JSON. CUDA is the default; CPU is an explicit debug option. LocalRNG runs only in benchmark mode.</desc>
